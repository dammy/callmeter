# Smithery remote MCP — CallMeter
# https://smithery.ai
name: dammyg/callmeter
target: remote
runtime: typescript

startCommand:
  type: http
  url: https://api.callmeter.dev/mcp
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        title: CallMeter API key
        description: Optional X-Api-Key for existing prepaid balance. New charges use x402. No Paystack top-up. tools/list works without it; tools/call needs key or x402.
        x-from:
          header: x-api-key
    required: []
  exampleConfig: {}

metadata:
  displayName: CallMeter
  description: >-
    First paid job: parse a receipt → structured JSON ≈ $0.10 via x402 USDC on Base.
    Demo (free to try the UX): https://api.callmeter.dev/demo/receipt-to-json
    Pay path: unpaid tools/call or POST /v1/docintel/extract/receipt → HTTP 402 → settle x402 on Base. Discovery: https://api.callmeter.dev/.well-known/x402
    Signup (API key / ledger identity; no card checkout): https://api.callmeter.dev/signup

    CallMeter is crypto-only by default. Prepaid fiat (Paystack/Flutterwave) is unavailable until CallMeter-native fiat returns. Existing prepaid balances still debit if present; new charges use x402.

    Also: schema breaking-change check ≈ $0.05 (detect.schema_breaking_changes / POST /v1/agentutils/diff). tools/list is free; tools/call is paid. Fail-closed — never charged on failed fulfillment.

    MCP: https://api.callmeter.dev/mcp
  homepage: https://api.callmeter.dev/
  repository: https://github.com/dammy/callmeter
  license: MIT
  categories:
    - mcp
    - payments
    - agents
    - document-intelligence
    - webhooks
    - utilities
  tags:
    - mcp
    - x402
    - payments
    - agents
    - receipts
    - pdf
    - webhooks
    - schema
    - document-intelligence
    - screenshot
    - extract
    - invoices
