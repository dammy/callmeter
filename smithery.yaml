# Smithery remote MCP — CallMeter
# https://smithery.ai
name: dammyg/callmeter
target: remote
runtime: typescript

startCommand:
  type: http
  url: https://api.callmeter.dev/mcp
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        title: CallMeter API key
        description: Optional X-Api-Key for existing prepaid balance. New charges use x402. No Paystack top-up. tools/list works without it; tools/call needs key or x402.
        x-from:
          header: x-api-key
    required: []
  exampleConfig: {}

metadata:
  displayName: CallMeter
  description: >-
    Near-term paid hop: draft or validate JSON Schema (transform.json_schema ≈ $0.02)
    via x402 USDC on Base. Unpaid tools/call or POST /v1/agentutils/schema → HTTP 402.
    Discovery: https://api.callmeter.dev/.well-known/x402

    Receipt→JSON (parse.receipt ≈ $0.10) remains demo/depth —
    demo: https://api.callmeter.dev/demo/receipt-to-json

    CallMeter is crypto-only by default. Prepaid fiat packs are closed. Existing prepaid
    balances still debit if present; new charges use x402. tools/list is free; tools/call
    is paid. Fail-closed — never charged on failed fulfillment.

    MCP: https://api.callmeter.dev/mcp
    Do NOT use callmeter.run.tools for unpaid→402 (Smithery OAuth 401).
  homepage: https://api.callmeter.dev/
  repository: https://github.com/dammy/callmeter
  license: MIT
  categories:
    - mcp
    - payments
    - agents
    - document-intelligence
    - webhooks
    - utilities
  tags:
    - mcp
    - x402
    - payments
    - agents
    - receipts
    - pdf
    - webhooks
    - schema
    - document-intelligence
    - screenshot
    - extract
    - invoices
