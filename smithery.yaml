# Smithery remote MCP — CallMeter
# https://smithery.ai
name: dammyg/callmeter
target: remote
runtime: typescript

startCommand:
  type: http
  url: https://api.callmeter.dev/mcp
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        title: CallMeter API key
        description: Prepaid key (bf_live… / bf_test…). Mint a key and buy min $10 / 1000 credits via Paystack at https://api.callmeter.dev/signup. tools/list works without it; tools/call needs key or x402.
        x-from:
          header: x-api-key
    required: []
  exampleConfig: {}

metadata:
  displayName: CallMeter
  description: >-
    CallMeter turns till slips into merchant/total/line-item JSON (parse.receipt; demo
    https://api.callmeter.dev/demo/receipt-to-json) plus extract, schema, schema breaking-change
    detect (detect.schema_breaking_changes), screenshots, PDF text, invoices, and webhook
    relay/replay. Discover tools for free via tools/list; pay per tools/call with prepaid credits
    (X-Api-Key / Bearer; mint + Paystack min $10 at https://api.callmeter.dev/signup) or x402
    USDC on Base (PAYMENT-SIGNATURE; unpaid → 402).
  homepage: https://api.callmeter.dev/
  repository: https://github.com/dammy/callmeter
  license: MIT
  categories:
    - mcp
    - payments
    - agents
    - document-intelligence
    - webhooks
    - utilities
  tags:
    - mcp
    - x402
    - payments
    - agents
    - receipts
    - pdf
    - webhooks
    - schema
    - document-intelligence
    - screenshot
    - extract
    - invoices
